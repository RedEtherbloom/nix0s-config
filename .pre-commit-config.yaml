repos:
  - repo: https://github.com/kamadorueda/alejandra
    rev: 4.0.0
    hooks:
    - id: alejandra-system
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    - id: check-json
    - id: check-toml
    - id: check-yaml
    - id: detect-private-key
    - id: trailing-whitespace
