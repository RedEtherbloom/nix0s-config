# TODO: Turn the positions dynamic
background {
    monitor =
    path = @BACKGROUND_IMAGE@

    blur_size = 5
    blur_passes = 2
    noise = 0.0117
    contrast = 1.3000 # Vibrant!!!
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

input-field {
    # Required?
    monitor =
    size = 30%, 5%
    outline_thickness = 3
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 1.00 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgb(7AA2F7)
    inner_color = rgb(1A1B26)
    font_color = rgb(F7768E)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, 3%
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] echo "<b><big>$(date +"%H")$(@SYMBOL_SCRIPT@)$(date +"%M")</big></b>"
    color = rgb(F7768E)
    font_size = 96
    font_family = @FONT@
    position = 0, 6%
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%A, %d %b") </big></b>"
    color = rgb(A9B1D6)
    font_size = 16
    font_family = @FONT@
    position = 0, 0
    halign = center
    valign = top
}
